name: build-annibale

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline | bakasu | full"
        type: choice
        options: [baseline, bakasu, full]
        default: baseline
      security_patch:
        description: "none = 不合并 ACK；后续实验用"
        type: string
        default: none
      enable_bbg:
        type: boolean
        default: true
      enable_droidspaces:
        type: boolean
        default: true
      enable_ntsync:
        type: boolean
        default: true
      enable_nomount:
        type: boolean
        default: true
      enable_zram:
        type: boolean
        default: true
      enable_network:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/az /usr/local/lib/heroku || true
          sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          docker rmi -f $(docker images -q) 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip python3 python3-pip \
            bison flex libssl-dev build-essential bc rsync cpio \
            device-tree-compiler libelf-dev dwarves openssl clang lld llvm

      - name: Clone Xiaomi official source (shallow)
        if: inputs.security_patch == 'none'
        run: |
          set -euo pipefail
          git clone --depth=1 --branch annibale-w-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git src
          cd src
          echo "=== head of Makefile ==="
          head -8 Makefile

      - name: Clone Xiaomi official source (full history for CVE merge)
        if: inputs.security_patch != 'none'
        run: |
          set -euo pipefail
          git clone --branch annibale-w-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git src
          cd src
          echo "=== head of Makefile ==="
          head -8 Makefile

      - name: Backport security patches (experimental)
        if: inputs.security_patch != 'none'
        run: |
          bash "$GITHUB_WORKSPACE/scripts/backport_security.sh" \
            "$GITHUB_WORKSPACE/src" "${{ inputs.security_patch }}"

      - name: Diagnose source layout
        run: |
          cd src
          echo "=== top-level ==="
          ls -la | head -80
          echo "=== build configs / bzl / configs ==="
          find . -maxdepth 3 \( \
            -name 'build.config.msm.annibale' -o \
            -name 'annibale*.bzl' -o \
            -name 'annibale_*.config' -o \
            -name 'msm_platforms.bzl' -o \
            -name 'target_variants.bzl' \) -print | sort
          echo "=== tools dir ==="
          ls -la tools 2>/dev/null | head -40 || true
          echo "=== bazel wrapper? ==="
          test -x tools/bazel && echo "tools/bazel: yes" || echo "tools/bazel: no"

      - name: Diagnose build system
        run: |
          cd src
          echo "=== build.config.msm.annibale ==="
          cat build.config.msm.annibale
          echo "=== build.config.msm.sun ==="
          cat build.config.msm.sun
          echo "=== build.config.msm.common (head) ==="
          sed -n '1,120p' build.config.msm.common
          echo "=== vendor configs ==="
          ls -l arch/arm64/configs/vendor/annibale* 2>/dev/null || true
          head -20 arch/arm64/configs/vendor/annibale_consolidate.config 2>/dev/null || true
          echo "=== available build entrypoints ==="
          ls -l build_with_bazel.py 2>/dev/null || true
          python3 build_with_bazel.py --help 2>&1 | head -30 || true
          echo "=== kleaf/prebuilts siblings? ==="
          ls -d build/kernel prebuilts common 2>/dev/null || echo "none of build/kernel prebuilts common exist"
          echo "=== clang ==="
          clang --version | head -2
          ld.lld --version | head -1

      - name: Prune references to unpublished vendor dirs
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/prune_missing.py" "$GITHUB_WORKSPACE/src"

      - name: Apply features
        env:
          MODE: ${{ inputs.mode }}
          ENABLE_BBG: ${{ inputs.enable_bbg && '1' || '0' }}
          ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces && '1' || '0' }}
          ENABLE_NTSYNC: ${{ inputs.enable_ntsync && '1' || '0' }}
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount && '1' || '0' }}
          ENABLE_ZRAM: ${{ inputs.enable_zram && '1' || '0' }}
          ENABLE_NETWORK: ${{ inputs.enable_network && '1' || '0' }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/apply_features.sh" "$GITHUB_WORKSPACE/src"

      - name: Build kernel
        id: build
        run: |
          set -o pipefail
          cd src
          if [ -x tools/bazel ]; then
            TARGETS="//:annibale_consolidate_dist //:annibale_dist //msm-kernel:annibale_consolidate_dist //msm-kernel:annibale_dist"
            OK=""
            for T in $TARGETS; do
              echo "=========== trying target: $T ==========="
              if timeout 18000 tools/bazel build "$T" 2>&1 | tee "build-$(echo "$T" | tr '/:' '__').log"; then
                OK="$T"
                break
              fi
              echo "target $T failed, trying next"
            done
            if [ -z "$OK" ]; then
              echo "::error::all Kleaf build targets failed"
              exit 1
            fi
            echo "built target: $OK"
          else
            echo "tools/bazel not found -> fallback to plain kbuild"
            export ARCH=arm64 LLVM=1
            CONFIGS=""
            for c in arch/arm64/configs/vendor/annibale_consolidate.config \
                     arch/arm64/configs/vendor/annibale_perf.config; do
              [ -f "$c" ] && CONFIGS="$CONFIGS $c"
            done
            [ -n "$CONFIGS" ] || { echo "::error::no annibale vendor config found"; exit 1; }
            for CFG in $CONFIGS; do
              BASE=$(basename "$CFG" .config)
              OD="out-$BASE"
              LOG="plain-$BASE.log"
              echo "=========== plain kbuild: $CFG ==========="
              rm -rf "$OD"; mkdir -p "$OD"
              cp "$CFG" "$OD/.config"
              if ! make O="$OD" ARCH=arm64 LLVM=1 olddefconfig 2>&1 | tee "$LOG"; then
                echo "olddefconfig failed for $CFG"; continue
              fi
              if make O="$OD" ARCH=arm64 LLVM=1 -j"$(nproc)" Image 2>&1 | tee -a "$LOG"; then
                printf 'PLAIN_OUT=%s\nPLAIN_IMAGE=%s/arch/arm64/boot/Image\n' "$OD" "$OD" > plain-build.txt
                break
              fi
            done
            [ -f plain-build.txt ] || { echo "::error::plain kbuild failed"; exit 1; }
            cat plain-build.txt
          fi

      - name: Collect Image
        run: |
          set -euo pipefail
          cd src
          IMG=$(find out out-* bazel-bin -type f -name 'Image' -size +15M 2>/dev/null | head -n 1 || true)
          if [ -z "$IMG" ]; then
            echo "::error::Image not found"
            find out out-* bazel-bin -maxdepth 6 -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          echo "Image: $IMG"
          cp "$IMG" "$GITHUB_WORKSPACE/Image"
          strings "$GITHUB_WORKSPACE/Image" | grep -m1 'Linux version' || true
          strings "$GITHUB_WORKSPACE/Image" | grep -m1 'vermagic=' || true

      - name: Package boot.img
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/package_boot.sh" \
            "$GITHUB_WORKSPACE/Image" "$GITHUB_WORKSPACE/out_boot"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annibale-${{ inputs.mode }}
          path: |
            out_boot/boot.img
            out_boot/Image
            Image
            src/build-*.log
            src/bazel-*.log
            src/plain-*.log
          if-no-files-found: warn
          retention-days: 14
