name: build-annibale

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline | bakasu | full"
        type: choice
        options: [baseline, bakasu, full]
        default: baseline
      security_patch:
        description: "none = 不合并 ACK 安全补丁"
        type: string
        default: none
      localversion:
        description: "GKI 内核 localversion（必须与 stock uname -r 的后缀一致）"
        type: string
        default: "-android15-8-g0908354dac1b-ab16143355-4k"
      enable_bbg:
        type: boolean
        default: true
      enable_droidspaces:
        type: boolean
        default: true
      enable_ntsync:
        type: boolean
        default: true
      enable_nomount:
        type: boolean
        default: true
      enable_zram:
        type: boolean
        default: true
      enable_network:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        target: [gki, xiaomi]

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/az /usr/local/lib/heroku || true
          sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          docker rmi -f $(docker images -q) 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip python3 python3-pip \
            bison flex libssl-dev build-essential bc rsync cpio \
            device-tree-compiler libelf-dev dwarves openssl clang lld llvm ccache

      - name: Clone GKI source (ACK android15-6.6-2026-01)
        if: matrix.target == 'gki'
        run: |
          set -euo pipefail
          git clone --depth=1 --branch android15-6.6-2026-01 \
            https://android.googlesource.com/kernel/common src
          cd src
          head -6 Makefile

      - name: Clone Xiaomi source (annibale-w-oss)
        if: matrix.target == 'xiaomi'
        run: |
          set -euo pipefail
          git clone --depth=1 --branch annibale-w-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git src
          cd src
          head -6 Makefile

      - name: Diagnose Xiaomi source layout
        if: matrix.target == 'xiaomi'
        run: |
          cd src
          echo "=== top-level ==="
          ls -la | head -60
          echo "=== build configs / vendor configs ==="
          ls -l build.config.msm.annibale build.config.msm.sun build.config.msm.perf 2>/dev/null || true
          ls -l arch/arm64/configs/vendor/annibale* 2>/dev/null || true
          echo "=== GKI defconfig fragment ==="
          grep -E '^CONFIG_(LOCALVERSION|KASAN|LOCKDEP)=' arch/arm64/configs/gki_defconfig || true

      - name: Prune unpublished vendor dirs
        if: matrix.target == 'xiaomi'
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/prune_missing.py" "$GITHUB_WORKSPACE/src"

      - name: Apply features (Xiaomi target only)
        if: matrix.target == 'xiaomi'
        env:
          MODE: ${{ inputs.mode }}
          ENABLE_BBG: ${{ inputs.enable_bbg && '1' || '0' }}
          ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces && '1' || '0' }}
          ENABLE_NTSYNC: ${{ inputs.enable_ntsync && '1' || '0' }}
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount && '1' || '0' }}
          ENABLE_ZRAM: ${{ inputs.enable_zram && '1' || '0' }}
          ENABLE_NETWORK: ${{ inputs.enable_network && '1' || '0' }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/apply_features.sh" "$GITHUB_WORKSPACE/src"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.target }}-${{ inputs.mode }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.target }}-${{ inputs.mode }}-
            ccache-${{ runner.os }}-${{ matrix.target }}-

      - name: Build kernel
        env:
          JOBS: "0"
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "gki" ]; then
            export KERNEL_LOCALVERSION="${{ inputs.localversion }}"
            bash "$GITHUB_WORKSPACE/scripts/build_gki.sh" "$GITHUB_WORKSPACE/src"
          else
            bash "$GITHUB_WORKSPACE/scripts/build_kernel.sh" "$GITHUB_WORKSPACE/src"
          fi

      - name: Collect Image
        run: |
          set -euo pipefail
          cd src
          IMG=$(find out out-* bazel-bin -type f -name 'Image' -size +10M 2>/dev/null | head -n 1 || true)
          if [ -z "$IMG" ]; then
            echo "::error::Image not found"
            find out out-* bazel-bin -maxdepth 6 -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          echo "Image: $IMG"
          cp "$IMG" "$GITHUB_WORKSPACE/Image"
          strings "$GITHUB_WORKSPACE/Image" | grep -m1 'Linux version' || true
          strings "$GITHUB_WORKSPACE/Image" | grep -m1 'vermagic=' || true

      - name: Package AnyKernel3 (kernel only)
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/package_anykernel3.sh" \
            "$GITHUB_WORKSPACE/Image" "$GITHUB_WORKSPACE/out_ak3" \
            "annibale-${{ matrix.target }}-${{ inputs.mode }}-AnyKernel3.zip"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annibale-${{ matrix.target }}-${{ inputs.mode }}
          path: |
            out_ak3/*.zip
            Image
            src/*.log
            src/build-*.log
            src/merge-*.log
          if-no-files-found: warn
          retention-days: 14
